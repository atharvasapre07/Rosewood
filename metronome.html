<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css">

    <title>Rosewood - Metronome</title>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="images/logo.svg" alt="">
            <span>Rosewood</span>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="metronome.html" aria-current="page">Metronome</a></li>
                <li><a href="#">Chords</a></li>
                <li><a href="#">Practice log</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-wrapper">
        <section class="metronome-panel">
            <p class="tempo-name">Andante</p>
            <div class="bpm-display" id="bpm-value">96</div>
            <p class="bpm-label">beats per minute</p>

            <div class="bpm-controls">
                <button class="step-btn" aria-label="Decrease tempo">&minus;</button>
                <input type="range" id="bpm-slider" min="30" max="240" value="96"
                    aria-label="Tempo in beats per minute">
                <button class="step-btn" aria-label="Increase tempo">+</button>
            </div>
        </section>
    </main>
</body> 

</html>
